<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家計ノート">
<link rel="apple-touch-icon" href="icon-192.png">

<title>レシート家計ノート</title>
<style>
:root{
 --bg:#f6f7f9;--card:#fff;--text:#16181d;--muted:#70757f;--line:#e7e9ee;
 --accent:#246bfd;--good:#14863d;--warn:#b26a00;--bad:#c62828;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Yu Gothic",sans-serif}
body{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
header{
 position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);
 backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--line);
 padding-top:env(safe-area-inset-top)
}
.head{padding:12px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center}
h1{margin:0;font-size:19px} .sub{font-size:12px;color:var(--muted);margin-top:2px}
main{padding:14px;max-width:720px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px}
.kpi .label{font-size:11px;color:var(--muted)} .kpi .value{font-size:18px;font-weight:800;margin-top:4px}
h2{font-size:17px;margin:0 0 12px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
input,select,textarea,button{font:inherit;font-size:16px}
input,select,textarea{
 width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:var(--text)
}
button{border:0;border-radius:13px;padding:12px 14px;font-weight:700;min-height:46px}
.primary{background:var(--accent);color:#fff}.secondary{background:#eef1f5;color:#111}.danger{background:#fde8e8;color:#9b1c1c}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
@media(max-width:420px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.kpis{grid-template-columns:1fr 1fr}.kpis .kpi:last-child{grid-column:1/-1}}
.progress{height:9px;border-radius:999px;background:#edf0f4;overflow:hidden}
.progress>div{height:100%;background:var(--accent)}
.budget{padding:11px 0;border-bottom:1px solid var(--line)}.budget:last-child{border-bottom:0}
.budget-top{display:flex;justify-content:space-between;gap:12px;margin-bottom:7px}
.budget-name{font-weight:750}.budget-numbers{font-size:12px;text-align:right;color:var(--muted)}
.tx{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}.tx .amount{font-weight:800}.tx .meta{font-size:12px;color:var(--muted)}
.badge{display:inline-block;background:#f0f2f5;padding:3px 7px;border-radius:999px;font-size:11px;margin-top:4px}
.thumb{width:50px;height:50px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.receipt{max-width:100%;max-height:320px;border-radius:14px;display:none;margin-top:8px}
.bottom{
 position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);
 backdrop-filter:blur(18px);border-top:1px solid var(--line);
 padding:8px 12px calc(8px + env(safe-area-inset-bottom));
 display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px
}
.bottom button{font-size:13px;padding:10px 8px;min-height:44px}
.notice{font-size:13px;line-height:1.55;background:#eef4ff;border-radius:12px;padding:10px 12px}
.hidden{display:none}
dialog{border:0;border-radius:18px;width:calc(100% - 24px);max-width:650px;padding:0}
dialog::backdrop{background:rgba(0,0,0,.35)}
</style>
</head>
<body>
<header>
 <div class="head">
  <div><h1>レシート家計ノート</h1><div class="sub">iPhone向け・オフライン対応</div></div>
  <input id="monthPicker" type="month" style="width:138px;padding:9px">
 </div>
</header>

<main>
 <div class="kpis">
  <div class="kpi"><div class="label">生活予算</div><div class="value" id="budgetTotal">¥0</div></div>
  <div class="kpi"><div class="label">使用済み</div><div class="value" id="spentTotal">¥0</div></div>
  <div class="kpi"><div class="label">残り</div><div class="value" id="remainingTotal">¥0</div></div>
 </div>

 <section class="card" style="margin-top:12px">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
   <h2>今月の予算</h2><button class="secondary" id="editBudgetBtn" style="padding:8px 10px;min-height:auto">編集</button>
  </div>
  <div id="budgetList"></div>
  <div class="notice" style="margin-top:12px">SBI証券 35,000円は生活費と分けて「資産形成」として管理します。</div>
 </section>

 <section class="card" id="addSection">
  <h2>支出を記録</h2>
  <div class="grid">
   <div><label>日付</label><input id="dateInput" type="date"></div>
   <div><label>金額</label><input id="amountInput" type="number" min="1" inputmode="numeric" placeholder="1280"></div>
   <div><label>カテゴリー</label><select id="categoryInput"></select></div>
   <div><label>支払方法</label><select id="paymentInput">
    <option>楽天カード</option><option>三井住友NL</option><option>現金</option><option>Suica</option><option>その他</option>
   </select></div>
   <div class="full"><label>店・内容</label><input id="merchantInput" placeholder="例：セブンイレブン"></div>
   <div class="full"><label>メモ</label><input id="memoInput" placeholder="例：必要だった / 欲しかった"></div>
   <div class="full"><label>レシート写真</label><input id="receiptInput" type="file" accept="image/*" capture="environment"><img id="receiptPreview" class="receipt"></div>
   <div class="full"><button class="primary" id="addBtn" style="width:100%">この支出を保存</button></div>
  </div>
 </section>

 <section class="card" id="historySection">
  <h2>今月の記録</h2>
  <div id="transactionList"></div>
 </section>

 <section class="card">
  <h2>データ管理</h2>
  <div class="grid">
   <button class="secondary" id="exportCsvBtn">CSV書き出し</button>
   <button class="secondary" id="exportJsonBtn">バックアップ</button>
   <label class="secondary" style="text-align:center;padding:13px;border-radius:13px;font-weight:700;color:#111;margin:0">
    復元<input id="importJsonInput" type="file" accept="application/json" style="display:none">
   </label>
  </div>
 </section>
</main>

<div class="bottom">
 <button class="secondary" onclick="window.scrollTo({top:0,behavior:'smooth'})">予算</button>
 <button class="primary" onclick="document.getElementById('addSection').scrollIntoView({behavior:'smooth'})">＋ 記録</button>
 <button class="secondary" onclick="document.getElementById('historySection').scrollIntoView({behavior:'smooth'})">履歴</button>
</div>

<dialog id="budgetDialog">
 <div class="card" style="margin:0;border:0">
  <h2>月予算を編集</h2>
  <div id="budgetEditor"></div>
  <div class="grid" style="margin-top:12px">
   <div><label>資産形成</label><input id="investmentBudget" type="number"></div>
   <div><label>月収目安</label><input id="incomeBudget" type="number"></div>
  </div>
  <div class="grid" style="margin-top:14px">
   <button class="secondary" id="cancelBudgetBtn">キャンセル</button>
   <button class="primary" id="saveBudgetBtn">保存</button>
  </div>
 </div>
</dialog>

<script>
const DEFAULT_BUDGETS={
"スーパー・食費":20000,"コンビニ":5000,"外食":10000,"彼女との交際費":30000,
"衣服・Amazon等":10000,"娯楽":10000,"Suica・交通":10000,"ETC":0,
"通信・ネット":5500,"サブスク":2400,"光熱水費":10000,"保険":3000,"その他":4100};
const KEY="iphone_kakeibo_v2";
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{months:{}};
let pendingReceipt=null;
const $=id=>document.getElementById(id);
const yen=n=>new Intl.NumberFormat("ja-JP",{style:"currency",currency:"JPY",maximumFractionDigits:0}).format(Number(n)||0);
function localToday(){
 const d=new Date();
 const y=d.getFullYear();
 const m=String(d.getMonth()+1).padStart(2,"0");
 const day=String(d.getDate()).padStart(2,"0");
 return `${y}-${m}-${day}`;
}
function monthNow(){return localToday().slice(0,7)}
function ensureMonth(ym){
 if(!data.months[ym]) data.months[ym]={budgets:{...DEFAULT_BUDGETS},investment:35000,income:200000,transactions:[]};
 return data.months[ym];
}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){
 const ym=$("monthPicker").value,m=ensureMonth(ym),spentBy={};
 m.transactions.forEach(t=>spentBy[t.category]=(spentBy[t.category]||0)+Number(t.amount));
 const bt=Object.values(m.budgets).reduce((a,b)=>a+Number(b||0),0);
 const st=m.transactions.reduce((a,t)=>a+Number(t.amount||0),0);
 $("budgetTotal").textContent=yen(bt);$("spentTotal").textContent=yen(st);$("remainingTotal").textContent=yen(bt-st);
 $("remainingTotal").style.color=bt-st<0?"var(--bad)":st/bt>.8?"var(--warn)":"var(--good)";
 $("categoryInput").innerHTML=Object.keys(m.budgets).map(c=>`<option>${esc(c)}</option>`).join("");
 $("budgetList").innerHTML=Object.entries(m.budgets).map(([c,b])=>{
  const s=spentBy[c]||0,r=b-s,p=b>0?Math.min(100,Math.round(s/b*100)):(s>0?100:0);
  return `<div class="budget"><div class="budget-top"><div class="budget-name">${esc(c)}</div>
  <div class="budget-numbers">使用 ${yen(s)} / ${yen(b)}<br><b style="color:${r<0?'var(--bad)':'inherit'}">残り ${yen(r)}</b></div></div>
  <div class="progress"><div style="width:${p}%;background:${r<0?'var(--bad)':p>=80?'var(--warn)':'var(--accent)'}"></div></div></div>`;
 }).join("");
 const arr=[...m.transactions].sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);
 $("transactionList").innerHTML=arr.length?arr.map(t=>`<div class="tx">
  <div class="meta">${esc(t.date.slice(5).replace("-","/"))}</div>
  <div><b>${esc(t.merchant||"支出")}</b><div class="badge">${esc(t.category)}</div><div class="meta">${esc(t.payment)}${t.memo?" ・ "+esc(t.memo):""}</div></div>
  <div style="text-align:right">${t.receipt?`<img class="thumb" src="${t.receipt}">`:""}<div class="amount">${yen(t.amount)}</div>
  <button class="danger" onclick="delTx('${t.id}')" style="padding:5px 8px;min-height:auto;font-size:11px">削除</button></div></div>`).join(""):'<div class="sub">まだ記録はありません。</div>';
 save();
}
function delTx(id){if(confirm("この支出を削除しますか？")){let m=ensureMonth($("monthPicker").value);m.transactions=m.transactions.filter(t=>t.id!==id);render()}}
window.delTx=delTx;
function compress(file){return new Promise((resolve,reject)=>{const r=new FileReader(),img=new Image();r.onload=()=>img.src=r.result;r.onerror=reject;img.onload=()=>{const max=1400,sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=img.width*sc;c.height=img.height*sc;c.getContext("2d").drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",.72))};r.readAsDataURL(file)})}
$("receiptInput").onchange=async e=>{const f=e.target.files[0];if(!f)return;pendingReceipt=await compress(f);$("receiptPreview").src=pendingReceipt;$("receiptPreview").style.display="block"}
$("addBtn").onclick=()=>{const a=Number($("amountInput").value);if(!a||!$("dateInput").value){alert("日付と金額を入力してください");return}
 let m=ensureMonth($("monthPicker").value);m.transactions.push({id:String(Date.now())+Math.random(),date:$("dateInput").value,category:$("categoryInput").value,amount:a,payment:$("paymentInput").value,merchant:$("merchantInput").value.trim(),memo:$("memoInput").value.trim(),receipt:pendingReceipt,createdAt:Date.now()});
 $("amountInput").value="";$("merchantInput").value="";$("memoInput").value="";$("receiptInput").value="";pendingReceipt=null;$("receiptPreview").style.display="none";render();navigator.vibrate?.(30)}
$("editBudgetBtn").onclick=()=>{let m=ensureMonth($("monthPicker").value);$("budgetEditor").innerHTML=Object.entries(m.budgets).map(([c,v])=>`<div class="grid" style="margin-bottom:8px"><div><label>${esc(c)}</label></div><div><input class="be" data-c="${esc(c)}" type="number" value="${v}"></div></div>`).join("");$("investmentBudget").value=m.investment;$("incomeBudget").value=m.income;$("budgetDialog").showModal()}
$("cancelBudgetBtn").onclick=()=>$("budgetDialog").close();
$("saveBudgetBtn").onclick=()=>{let m=ensureMonth($("monthPicker").value);document.querySelectorAll(".be").forEach(x=>m.budgets[x.dataset.c]=Number(x.value)||0);m.investment=Number($("investmentBudget").value)||0;m.income=Number($("incomeBudget").value)||0;$("budgetDialog").close();render()}
$("monthPicker").onchange=()=>{$("dateInput").value=$("monthPicker").value+"-01";render()}
function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
$("exportCsvBtn").onclick=()=>{let m=ensureMonth($("monthPicker").value);let rows=[["日付","カテゴリー","店・内容","金額","支払方法","メモ"],...m.transactions.map(t=>[t.date,t.category,t.merchant,t.amount,t.payment,t.memo])];let csv=rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");dl(new Blob(["\ufeff"+csv],{type:"text/csv"}),`家計簿_${$("monthPicker").value}.csv`)}
$("exportJsonBtn").onclick=()=>dl(new Blob([JSON.stringify(data)],{type:"application/json"}),"家計ノート_バックアップ.json");
$("importJsonInput").onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(x.months&&confirm("現在のデータを置き換えますか？")){data=x;render()}}catch{alert("読み込めませんでした")}}
$("monthPicker").value=monthNow();
$("dateInput").value=localToday();
render();

</script>
</body></html>
